name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt mypy ruff
      - name: Lint with ruff
      - name: Lint with ruff (check)
        continue-on-error: run: ruff check src tests
      - name: Suggest ruff fixes
  if: failure()
  run: |
    echo "You can run 'ruff check --fix src tests' locally to auto-apply fixable issues."
